name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci
      - name: Verify release tag and notes
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release.mjs
      - name: Check public files
        run: npm run check:public
      - name: Check syntax
        run: npm run check
      - name: Test
        run: npm test
      - name: Install Electron runtime
        run: npm exec --no -- install-electron
      - name: Check source app workflows
        run: npm run smoke
      - name: Build unsigned Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged app
        run: npm run smoke:packaged
      - name: Generate release checksums
        run: npm run release:checksums
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: |
            dist/Neverquest-Setup-*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          gh run download $env:BUILD_RUN --name windows-installer --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the verified installer.' }
          $version = $env:RELEASE_TAG.Substring(1)
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "Neverquest $version" --notes-file "docs/releases/$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release. Review existing drafts before retrying.' }
